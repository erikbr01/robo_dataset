# Postprocess for robomimic abs-action tasks.
# Converts the 6D rotation slice (indices 3–8) in the 10-dim action back to
# axis-angle, yielding the standard 7-dim robot action: [pos(3) aa(3) gripper(1)].
# Applied AFTER policy.predict_action() — identical at train + inference.
_target_: robo_dataset.transforms.InferencePipeline
transforms:
  - _target_: robo_dataset.transforms.ConvertRotation
    rotation_start: 3
    rotation_end: 9
    from_rep: rotation_6d
    to_rep: axis_angle
