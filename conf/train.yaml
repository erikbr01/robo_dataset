defaults:
  - store: zarr_disk
  - shape_meta: robomimic_lift_ph
  - transforms/disk@disk_transforms: resize
  - transforms/cpu@cpu_transform: split_obs_image
  - transforms/gpu@gpu_transform: random_crop
  - _self_

# Store path — override from CLI: store.path=/data/my_zarr
store:
  path: ???

# Dataset / sampling
horizon: 16
pad_before: 1
pad_after: 7
n_obs_steps: 2
val_ratio: 0.1
seed: 42

# DataLoader
batch_size: 32
num_workers: 8

# Disk-cache config
cache:
  enabled: true
  root: /tmp/robo_dataset_cache

# Training
max_epochs: 100
device: cuda
