# Transforms for single-arm robomimic image rel-action tasks.
# Compatible data_sources: lift_image, can_image, square_image, tool_hang_image, lift_mh_image
#
# Preprocess:  ImageNet-normalise agentview + eye-in-hand cameras (uint8 → float)
# Postprocess: identity — action is already axis_angle (7-dim), no conversion needed

preprocess:
  _target_: robo_dataset.transforms.InferencePipeline
  transforms:
    - _target_: robo_dataset.transforms.NormalizeImages
      keys: [agentview_image, robot0_eye_in_hand_image]
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      from_uint8: true

postprocess:
  _target_: robo_dataset.transforms.InferencePipeline
  transforms:
    - _target_: robo_dataset.transforms.IdentityAction
