[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "robo_dataset"
version = "0.1.0"
description = "Unified trajectory dataset for robot learning"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "zarr<3.0",
    "numcodecs<0.13",
    "numba",
    "h5py",
    "opencv-python",
    "tqdm",
    "hydra-core>=1.3",
    "omegaconf",
    "tfrecord",
    "crc32c",
]

[project.optional-dependencies]
video = ["torchcodec"]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robo_dataset*"]
