[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robo_dataset"
version = "0.1.0"
description = "Unified trajectory dataset for robot learning"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "zarr>=2.12",
    "numcodecs",
    "numba",
    "h5py",
    "opencv-python",
    "tqdm",
    "hydra-core>=1.3",
    "omegaconf",
    "tfrecord",
    "crc32c",
]

[project.optional-dependencies]
video = ["torchcodec"]
# backends/lerobot.py reads parquet (episode metadata + frame columns) via
# pyarrow; without it the LeRobot backend raises ModuleNotFoundError on open.
# av decodes the mp4 side when torchcodec is absent, and every LeRobot video
# test needs it — a dev install without it silently skips the whole module.
lerobot = ["pyarrow", "av"]
dev = ["pytest", "pytest-xdist", "pyarrow", "av"]

[tool.hatch.build.targets.wheel]
packages = ["robo_dataset"]

[tool.uv]
# Store uv cache on ssdB to avoid filling root filesystem
cache-dir = "/mnt/ssdB/erik/uv_cache"

[tool.uv.sources]
# Pin torch to avoid re-downloading if already in the conda env

[tool.pytest.ini_options]
testpaths = ["tests"]
