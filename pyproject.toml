[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robo_dataset"
version = "0.1.0"
description = "Unified trajectory dataset for robot learning"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "zarr<3.0",
    "numcodecs<0.13",
    "numba",
    "h5py",
    "opencv-python",
    "tqdm",
    "hydra-core>=1.3",
    "omegaconf",
    "tfrecord",
    "crc32c",
]

[project.optional-dependencies]
video = ["torchcodec"]
dev = ["pytest", "pytest-xdist"]

[tool.hatch.build.targets.wheel]
packages = ["robo_dataset"]

[tool.uv]
# Store uv cache on ssdB to avoid filling root filesystem
cache-dir = "/mnt/ssdB/erik/uv_cache"

[tool.uv.sources]
# Pin torch to avoid re-downloading if already in the conda env

[tool.pytest.ini_options]
testpaths = ["tests"]
